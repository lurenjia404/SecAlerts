# 工作流名称
name: Build and Deploy Security Articles
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # UTC 0点=北京时间8点；UTC12点=北京时间20点，一天两次抓取
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script to generate pages
        run: python main.py

      - name: Commit and push updated archive
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add -A archive/
          git diff --staged --quiet || (git commit -m "Automated update of archive data" && git push)

