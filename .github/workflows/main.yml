# 工作流名称
name: Build and Deploy Security Articles
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Run script to generate pages
        run: python main.py || true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # 自动生成Gemfile + 安装依赖
      - name: Prepare Gemfile & bundle install
        run: |
          if [ ! -f Gemfile ]; then
            cat > Gemfile <<EOF
source "https://rubygems.org"
gem "jekyll", "~> 4.3"
gem "jekyll-theme-hacker"
gem "jekyll-paginate"
gem "jekyll-sitemap"
EOF
          fi
          bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/SecAlerts"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

